<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <meta name="description" content="A lightweight, responsive, and persistent To-Do list application to manage, filter, and reorder your daily tasks.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">

    <link rel="stylesheet" href="styles/main.css">
    <script type="module" src="scripts/main.js"></script> 
</head>
<body>
    <main class="app">
        <h1>To-Do List</h1>
        <form id="task-form" aria-label="Add a task">
            <input id="task-input" type="text" placeholder="Add a new task" required>
            <button type="submit">Add</button>
        </form>
         <!-- NEW: Filter Buttons Container -->
        <div class="filters">
            <button id="filter-all" class="filter-btn active" data-filter="all">All</button>
            <button id="filter-active" class="filter-btn" data-filter="active">Active</button>
            <button id="filter-completed" class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <ul id="tasks" aria-live="polite"></ul>
        <div class="actions">
            <button id="clear-completed">Clear Completed</button>
            <button id="clear-all">Clear All</button>
        </div>
    </main>
</body>
</html>
